<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VTK.wasm feasibility probe</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10131a; color: #e7ecf3;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #stage { position: relative; width: 100vw; height: 100vh; }
      #probe-canvas { display: block; width: 100%; height: 100%; }
      #provenance { position: absolute; left: 12px; bottom: 12px; padding: 8px 10px;
        background: rgba(8,10,14,.86); border: 1px solid #2c3442; border-radius: 6px;
        max-width: 72ch; white-space: pre-wrap; }
      #status { position: absolute; left: 12px; top: 12px; padding: 8px 10px;
        background: rgba(8,10,14,.86); border: 1px solid #2c3442; border-radius: 6px; }
    </style>
    <!--
      Collectors are installed in a classic script BEFORE the probe module, so
      "0 console errors" cannot mean "the collector was installed after the
      errors happened". Assertion A10 also requires the probe to have reached
      its terminal state, so "0 errors" cannot mean "0 work".
    -->
    <script>
      window.__probeErrors = [];
      window.__probeNet = [];
      window.__corruptScientificBin = false;
      window.addEventListener('error', function (e) {
        window.__probeErrors.push({kind: 'error', message: String(e.message), source: String(e.filename || '')});
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__probeErrors.push({kind: 'unhandledrejection', message: String((e.reason && e.reason.message) || e.reason)});
      });
      (function () {
        var orig = console.error;
        console.error = function () {
          try { window.__probeErrors.push({kind: 'console.error', message: Array.prototype.map.call(arguments, String).join(' ')}); } catch (_) {}
          return orig.apply(console, arguments);
        };
      })();
      (function () {
        var origFetch = window.fetch.bind(window);
        window.fetch = async function (input, init) {
          var url = typeof input === 'string' ? input : (input && input.url) || String(input);
          var res = await origFetch(input, init);
          window.__probeNet.push({url: url, status: res.status, ok: res.ok});
          if (window.__corruptScientificBin && url.indexOf('scientific.bin') !== -1) {
            // Negative control for A3: flip one byte so the manifest's sha256
            // can no longer match. If the loader still succeeds, its hash
            // check is not load-bearing and A3 is not evidence.
            var buf = await res.arrayBuffer();
            var view = new Uint8Array(buf);
            view[0] = view[0] ^ 0xff;
            return new Response(buf, {status: res.status, statusText: res.statusText, headers: res.headers});
          }
          return res;
        };
      })();
    </script>
  </head>
  <body>
    <div id="stage">
      <canvas id="probe-canvas"></canvas>
      <div id="status">booting</div>
      <div id="provenance"></div>
    </div>
    <script type="module" src="/probe.ts"></script>
  </body>
</html>
