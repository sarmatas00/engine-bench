[pytest]
# scripts/real/tests and scripts/scientific/tests are both packages named
# `tests` (each has an __init__.py) and neither parent is a package, so the
# default prepend import mode makes them collide: collecting both in one run
# fails with "No module named 'tests.test_generate'". Each suite passes alone,
# which is how the package.json scripts run them, so the collision only shows
# up on a bare `pytest` across the repo -- the first thing a newcomer types.
#
# importlib mode imports each test module by its file location instead of by a
# derived package name, so same-named test packages coexist.
addopts = --import-mode=importlib
testpaths = scripts/real/tests scripts/scientific/tests
